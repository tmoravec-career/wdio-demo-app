name: e2e-ios

# On demand only: macOS runners cost ~10x Linux minutes, so iOS runs before a release
# or when a change touches iOS-specific code, not on every push.
#
# Simulator builds need no signing, so this job builds and tests in one place. The built
# .app is cached by a hash of everything that goes into it, so re-running tests on
# unchanged code skips the 20+ minute Xcode build.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: release, or test (seeded bugs available)
        type: choice
        options: [release, test]
        default: release
      suite:
        description: smoke | lifecycle | sleep (empty = all)
        required: false
      device:
        description: Simulator name
        default: iPhone 17

permissions:
  contents: read

env:
  APPIUM_VERSION: 3.9.0
  XCUITEST_VERSION: 12.22.8

jobs:
  e2e:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      PLATFORM: ios
      APP_VARIANT: ${{ inputs.variant }}
      SUITE: ${{ inputs.suite }}
      IOS_DEVICE: ${{ inputs.device }}
      EXPECT: pass
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Restore cached simulator build
        id: app-cache
        uses: actions/cache@v5
        with:
          path: apps/${{ inputs.variant }}/wdiodemoapp.app
          key: ios-sim-${{ inputs.variant }}-${{ hashFiles('package-lock.json', 'app.json', 'app/**', 'src/**', 'plugins/**') }}

      - name: Build simulator app
        if: steps.app-cache.outputs.cache-hit != 'true'
        env:
          EXPO_PUBLIC_SEEDED_BUGS: ${{ inputs.variant == 'test' && '1' || '' }}
        run: |
          npm ci
          npm run ios:prebuild # pod install: the .xcworkspace is not committed
          npm run ios:release
          if [ "${{ inputs.variant }}" != release ]; then
            mkdir -p apps/${{ inputs.variant }}
            mv apps/release/wdiodemoapp.app apps/${{ inputs.variant }}/
          fi
          rm -f apps/*/*.zip # one bundle per variant directory

      - name: Install test dependencies
        working-directory: e2e
        run: npm ci

      - name: Install and start Appium
        run: |
          npm i -g appium@${APPIUM_VERSION}
          appium driver install xcuitest@${XCUITEST_VERSION}
          mkdir -p e2e/reports
          nohup appium --log e2e/reports/appium.log --log-level info > /dev/null 2>&1 &

      - name: Boot simulator
        run: |
          xcrun simctl boot "$IOS_DEVICE"
          xcrun simctl bootstatus "$IOS_DEVICE" -b

      # WebDriverAgent builds on first session; give it its own step so a slow build is visible.
      - name: Pre-build WebDriverAgent
        run: appium driver run xcuitest build-wda --sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)" || true

      - name: Run suite
        run: ./e2e/scripts/ci-run.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-reports-ios-${{ inputs.variant }}
          path: e2e/reports
          retention-days: 14
